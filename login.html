<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Startup Cart</title><link rel="stylesheet" href="style-admin.css"></head><body class="adminbody"><div class="login"><div class="brand">STARTUP CART</div><h1>Admin Login</h1><p>Secure access for managing products, startups and orders.</p><form id="login"><label>Email<input required type="email" id="email" placeholder="admin@startupcart.in"></label><label>Password<input required type="password" id="password"></label><button class="button dark full">Sign in</button></form><p id="msg" class="hint"></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../supabase-client.js"></script><script>document.getElementById("login").onsubmit=async e=>{e.preventDefault();msg.textContent="Signing in…";const {error}=await getSupabase().auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}location.href="dashboard.html"}</script></body></html>
