<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approved Sources</title><link rel="stylesheet" href="style-admin.css"></head><body><div class="layout"><aside><a class="logo" href="dashboard.html">STARTUP CART</a><nav><a href="dashboard.html">Dashboard</a><a href="import-product.html">Import Product</a><a href="products.html">Products</a><a href="sources.html">Source Websites</a><a href="startups.html">Startups</a><a href="orders.html">Orders</a><a href="settings.html">Settings</a></nav></aside><main><div class="top"><h1>Approved Source Websites</h1></div><div class="panel"><label>Domain<input id="domain" placeholder="startupbrand.com"></label><button id="add" class="button dark">Approve domain</button><p class="hint">Only domains added here can be used by the product importer.</p></div><div id="list"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../supabase-client.js"></script><script src="guard.js"></script><script>async function refresh(){const {data,error}=await getSupabase().from("approved_sources").select("*").order("created_at",{ascending:false});list.innerHTML=error?'<div class="panel error">'+error.message+'</div>':(data||[]).map(x=>`<div class="row"><div><b>${x.domain}</b><small>Approved source</small></div><button class="button" onclick="removeSource('${x.id}')">Remove</button></div>`).join("")}async function removeSource(id){await getSupabase().from("approved_sources").delete().eq("id",id);refresh()}add.onclick=async()=>{let d=domain.value.trim().toLowerCase().replace(/^https?:\\/\\//,'').split('/')[0];if(!d)return;const {error}=await getSupabase().from("approved_sources").insert({domain:d});if(error)alert(error.message);domain.value="";refresh()};refresh()</script></body></html>
