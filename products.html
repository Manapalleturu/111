<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products</title><link rel="stylesheet" href="style-admin.css"></head><body><div class="layout"><aside><a class="logo" href="dashboard.html">STARTUP CART</a><nav><a href="dashboard.html">Dashboard</a><a href="import-product.html">Import Product</a><a href="products.html">Products</a><a href="sources.html">Source Websites</a><a href="startups.html">Startups</a><a href="orders.html">Orders</a><a href="settings.html">Settings</a></nav></aside><main><div class="top"><h1>Products</h1><a class="button dark" href="import-product.html">+ Import</a></div><div id="products"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../supabase-client.js"></script><script src="guard.js"></script><script>getSupabase().from("products").select("id,name,selling_price,published,image_url,startups(name)").order("created_at",{ascending:false}).then(({data,error})=>{if(error){products.innerHTML='<div class="panel error">'+error.message+'</div>';return}products.innerHTML=(data||[]).map(p=>`<div class="row"><img src="${p.image_url||''}"><div><b>${p.name}</b><small>${p.startups?.name||'Startup'} · ₹${p.selling_price}</small></div><span class="status">${p.published?'Published':'Draft'}</span><button class="button" onclick="togglePublish('${p.id}',${!p.published})">${p.published?'Unpublish':'Publish'}</button></div>`).join("")||'<div class="panel">No products yet.</div>'})</script></body></html><script>async function togglePublish(id,value){const {error}=await getSupabase().from("products").update({published:value}).eq("id",id);if(error)alert(error.message);else location.reload()}</script>
